<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Cascadia Mono', 'Consolas', monospace;
  }
  #lcd-frame {
    position: relative;
    width: 310px;
    height: 156px;
    background: rgba(2, 13, 23, 0.55);
    border: 1px solid rgba(56, 189, 248, 0.65);
    border-left: 2px solid #7DD3FC;
    box-shadow: inset 0 0 18px rgba(2, 132, 199, 0.25);
  }
  /* Fine LCD scanlines */
  #lcd-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(7, 34, 54, 0.45) 3px
    );
    pointer-events: none;
  }
  canvas {
    display: block;
    width: 310px;
    height: 156px;
  }
</style>
</head>
<body>
  <div id="lcd-frame">
    <canvas id="hud" width="310" height="156"></canvas>
  </div>

<script>
  const canvas = document.getElementById('hud');
  const ctx = canvas.getContext('2d');
  const frame = document.getElementById('lcd-frame');

  const W = 310, H = 156;
  const CHAR_SPACING = 16;
  const CLEAN_CYRILLIC = "АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯѲѢѴҒҚҢҮҲ";
  const NUMBERS = "0123456789";

  const TRAIL_COLORS = [
    "#FFFFFF", "#E0F2FE", "#BAE6FD", "#7DD3FC",
    "#38BDF8", "#38BDF8", "#0EA5E9"
  ];
  const FLICKER_DIM = ["#7DD3FC", "#38BDF8", "#0284C7", "#0369A1"];

  function randChoice(str) {
    return str[Math.floor(Math.random() * str.length)];
  }
  function randStr(str, len) {
    let out = "";
    for (let i = 0; i < len; i++) out += randChoice(str);
    return out;
  }
  function generateToken() {
    const r = Math.random();
    if (r < 0.34) return `${randStr(CLEAN_CYRILLIC, 2)}-${randStr(NUMBERS, 2)}`;
    if (r < 0.67) return randStr(CLEAN_CYRILLIC, Math.random() < 0.5 ? 4 : 5);
    return `${randStr(CLEAN_CYRILLIC, 2)}·${randStr(CLEAN_CYRILLIC, 2)}`;
  }

  class Stream {
    constructor(y, initX) {
      this.y = y;
      this.reset(initX);
    }
    reset(initX) {
      this.text = generateToken();
      this.speed = 0.65 + Math.random() * 0.4;
      this.x = initX !== undefined ? initX : W + 15 + Math.random() * 75;
    }
    update() {
      this.x -= this.speed;
      if (this.x + this.text.length * CHAR_SPACING < 18) this.reset();
    }
  }

  const TOP_MARGIN = 30;
  const ROW_SPACING = 32;
  const streams = [0, 1, 2, 3].map(
    i => new Stream(TOP_MARGIN + i * ROW_SPACING, 35 + Math.random() * (W - 55))
  );

  function drawFrame() {
    // Center 50% tick & row anchor dots
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(2, Math.floor(H / 2) - 1, 10, 2);

    ctx.fillStyle = "#0284C7";
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(8, TOP_MARGIN + i * ROW_SPACING, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);

    // Subtle LCD backlight flicker
    const voltageDip = Math.random() < 0.06;
    frame.style.background = voltageDip
      ? `rgba(2, 13, 23, ${(0.35 + Math.random() * 0.1).toFixed(2)})`
      : `rgba(2, 13, 23, ${(0.50 + Math.random() * 0.08).toFixed(2)})`;

    drawFrame();

    ctx.textBaseline = "middle";
    for (const s of streams) {
      s.update();
      for (let idx = 0; idx < s.text.length; idx++) {
        const cx = s.x + idx * CHAR_SPACING;
        if (cx > 18 && cx < W - 10) {
          let color = TRAIL_COLORS[Math.min(idx, TRAIL_COLORS.length - 1)];
          if (voltageDip || Math.random() < 0.045) {
            color = FLICKER_DIM[Math.floor(Math.random() * FLICKER_DIM.length)];
          } else if (Math.random() < 0.03) {
            color = "#FFFFFF";
          }

          ctx.font = `${idx <= 1 ? "bold " : ""}13px 'Cascadia Mono', Consolas, monospace`;

          // 1px dark contrast shadow
          ctx.fillStyle = "#020B12";
          ctx.fillText(s.text[idx], cx + 1, s.y + 1);

          // Glowing foreground glyph
          ctx.fillStyle = color;
          ctx.fillText(s.text[idx], cx, s.y);
        }
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
